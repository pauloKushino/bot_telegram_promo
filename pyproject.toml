[project]
name = "anime-deals-bot"
version = "0.1.0"
description = "Bot de promoções de anime para Telegram com link de afiliado"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.0,<4.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "httpx>=0.27,<1.0",
    "apscheduler>=3.10,<4.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "openai>=1.40,<2.0",
    "loguru>=0.7,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.6,<1.0",
    "telethon>=1.45.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deals"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["src", "tests"]
exclude = ["migrations"]  # código gerado pelo Alembic

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RET"]
